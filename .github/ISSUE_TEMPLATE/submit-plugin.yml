name: 提交社区插件
description: 申请将你的 WhaleLife 插件收录进公开目录。
title: "[收录] "
body:
  - type: markdown
    attributes:
      value: |
        首次投稿只需填写下面的公开仓库链接和一句话介绍。

        - **手动安装**　在插件仓库的 README 中写清安装步骤和依赖，即可申请收录「安装说明」。
        - **一键安装与更新**　用 WhaleLife 打包工具生成 `.wlpkg.gz`（如 `my-plugin-1.2.0.wlpkg.gz`），作为附件上传到自己仓库的正式 GitHub Release。标签与 `plugin.yaml` 版本对应。在发行说明中写明附件字节数、SHA-256、适用的 WhaleLife 版本、系统、架构和必需插件版本。[打包命令与格式说明](https://github.com/iinukami/whalelife/blob/main/market/community-packages.md#作者打包)

        收录后可以关闭投稿 Issue。维护者订阅原仓库的 Release，每个新版附件单独审核。
  - type: input
    id: repository
    attributes:
      label: 插件的公开 GitHub 仓库
      placeholder: https://github.com/作者/插件仓库
    validations:
      required: true
  - type: textarea
    id: introduction
    attributes:
      label: 一句话介绍
      description: 说说插件能做什么。如果有偏好的署名或单独的安装文档，也可以写在这里。
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: 插件图标链接（选填）
      description: 把 PNG 图片放在上面填写的插件仓库里，再粘贴图片文件的 GitHub 链接。推荐 256 × 256 像素的方图，最大 1 MiB，每边不超过 1024 像素。留空会使用默认图标。
      placeholder: https://github.com/作者/插件仓库/blob/main/icon.png
    validations:
      required: false
