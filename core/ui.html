<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhaleLife · 鲸鲸</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#193447;font:15px system-ui}header{background:#123d54;color:white;padding:24px 5%}h1{margin:0;font-size:24px}header p{color:#adcbd8}main{max-width:1100px;margin:24px auto;padding:0 20px}nav{display:flex;gap:8px;margin-bottom:20px}button{border:0;border-radius:7px;background:#167a92;color:white;padding:10px 18px;cursor:pointer}button:disabled{opacity:.5}section{background:white;padding:24px;border-radius:12px;box-shadow:0 3px 20px #19344708}input,textarea{font:inherit;border:1px solid #bccdd5;border-radius:6px;padding:10px;width:100%}#messages{min-height:300px;max-height:55vh;overflow:auto;white-space:pre-wrap}.message{padding:14px;margin:10px 0;border-radius:8px;background:#f0f6f8}.user{background:#dceef1}#logs{background:#102731;color:#c8e3e7;white-space:pre-wrap;max-height:65vh;overflow:auto;padding:18px;font:12px Consolas,monospace}.cards{display:flex;gap:16px;flex-wrap:wrap}.card{flex:1;background:#edf5f7;padding:18px;min-width:180px;border-radius:8px}.plugin{display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:14px 0}.plugin span{flex:1}small{color:#587481}#notice{color:#ba423a;margin:10px 0}textarea{margin:12px 0;min-height:80px}[hidden]{display:none!important}</style>
<header><h1>🐋 WhaleLife</h1><p>鲸鲸的本地核心 · M0</p></header><main><section id="login"><h2>进入控制台</h2><p>本机默认无需密码；配置访问密码后需输入。</p><input id="password" type="password" placeholder="访问密码"><p><button id="enter">登录</button></p></section><div id="app" hidden><nav><button data-tab="dashboard">仪表盘</button><button data-tab="chat">聊天测试</button><button data-tab="plugins">插件管理</button><button data-tab="logpage">日志</button></nav><section id="dashboard"><h2>核心状态</h2><div class="cards" id="cards"></div><p><small>模型、人格、权限配置修改后重启生效。模型状态以实际聊天请求结果为准。</small></p></section><section id="chat" hidden><h2>和鲸鲸聊天</h2><small id="sessionLabel"></small><div id="messages" aria-live="polite"></div><textarea id="input" placeholder="和鲸鲸说点什么，或说“记下这个……”"></textarea><button id="send">发送</button> <button id="newSession">新会话</button></section><section id="plugins" hidden><h2>插件树</h2><div id="pluginList"></div></section><section id="logpage" hidden><h2>实时日志</h2><div id="logs"></div></section></div><p id="notice" role="alert"></p></main><script>
const $=id=>document.getElementById(id);let chatWS,logWS;let session=localStorage.whaleSession||('web_'+crypto.randomUUID().replaceAll('-',''));localStorage.whaleSession=session;$('sessionLabel').textContent='会话 '+session;
const notice=text=>$('notice').textContent=text;async function api(path,data){const res=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const value=await res.json();if(!res.ok)throw Error(value.error);return value}
async function refresh(){const s=await api('/api/status');$('cards').replaceChildren();for(const [name,value] of [['核心',s.core],['模型',s.models.map(x=>x.model).join(', ')],['记忆',s.memory.files+' 个会话 / '+s.memory.bytes+' 字节'],['人格 / 权限',s.persona+' / '+s.permission]]){const div=document.createElement('div');div.className='card';const label=document.createElement('small');label.textContent=name;const p=document.createElement('p');p.textContent=value;div.append(label,p);$('cards').append(div)}$('pluginList').replaceChildren();for(const p of s.plugins){const row=document.createElement('div');row.className='plugin';const title=document.createElement('span');title.textContent=p.id+' · '+p.status+(p.error?' · '+p.error:'');row.append(title);if(!p.builtin)for(const [action,label] of [['start','启用'],['stop','停用'],['reload','重载']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{await api('/api/plugin',{id:p.id,action});await refresh()}catch(e){notice(e.message)}};row.append(b)}$('pluginList').append(row)}}
function connect(){const wsurl=location.origin.replace(/^http/,'ws');chatWS=new WebSocket(wsurl+'/ws/chat');chatWS.onmessage=e=>{const data=JSON.parse(e.data);if(data.type==='chunk'){if(!window.reply){window.reply=document.createElement('div');window.reply.className='message';$('messages').append(window.reply)}window.reply.textContent+=data.text;$('messages').scrollTop=$('messages').scrollHeight}else{if(data.type==='error')notice(data.error);$('send').disabled=false;window.reply=null;refresh().catch(e=>notice(e.message))}};chatWS.onclose=()=>{notice('聊天连接已断开，请刷新页面重连');$('send').disabled=true};logWS=new WebSocket(wsurl+'/ws/logs');logWS.onmessage=e=>{const d=JSON.parse(e.data);const logs=$('logs');logs.textContent=(logs.textContent+d.line+'\n').split('\n').slice(-1001).join('\n');logs.scrollTop=logs.scrollHeight}}
$('enter').onclick=async()=>{try{await api('/api/login',{password:$('password').value});$('login').hidden=true;$('app').hidden=false;notice('');await refresh();connect()}catch(e){notice(e.message)}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{for(const id of ['dashboard','chat','plugins','logpage'])$(id).hidden=id!==b.dataset.tab;refresh().catch(e=>notice(e.message))});
$('send').onclick=()=>{const text=$('input').value.trim();if(!text||chatWS?.readyState!==1)return;notice('');const div=document.createElement('div');div.className='message user';div.textContent=text;$('messages').append(div);window.reply=null;$('send').disabled=true;chatWS.send(JSON.stringify({session,text}));$('input').value=''};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}};
$('newSession').onclick=()=>{if($('send').disabled)return;session='web_'+crypto.randomUUID().replaceAll('-','');localStorage.whaleSession=session;$('sessionLabel').textContent='会话 '+session;$('messages').replaceChildren()};
</script></html>
